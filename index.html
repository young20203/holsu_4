const $ = id => document.getElementById(id);
const size = 128;
const font = '76px "Noto Sans CJK KR", "Malgun Gothic", sans-serif';
const choicesByQuestion = [
 ['그림','기타','숙제'],
 ['태권도','발표','해적선'],
 ['기타','숙제','그림'],
 ['그림','발표','태권도'],
 ['발표','해적선','기타'],
 ['숙제','그림','기타']
];
let index=0, level=0, pads=[], selected=false, done=false, sound=true, audio;
function play(ok){
 if(!ok) { try {navigator.vibrate?.(150)} catch{} }
 if(!sound) return;
 try{
  audio ||= new (window.AudioContext||window.webkitAudioContext)();
  audio.resume().catch(()=>{});
  const tone=audio.createOscillator(), gain=audio.createGain(), now=audio.currentTime;
  tone.frequency.setValueAtTime(ok?620:265,now);
  tone.frequency.setValueAtTime(ok?850:200,now+.11);
  gain.gain.setValueAtTime(.14,now);gain.gain.exponentialRampToValueAtTime(.001,now+.26);
  tone.connect(gain);gain.connect(audio.destination);tone.start(now);tone.stop(now+.27);
 }catch{}
}
function glyph(ctx,char,color){
 ctx.fillStyle=color;ctx.font=font;ctx.textAlign='center';ctx.textBaseline='alphabetic';
 const m=ctx.measureText(char);
 ctx.fillText(char,64,64+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2);
}
function makePad(char,i){
 const canvas=document.createElement('canvas');canvas.width=canvas.height=size;
 canvas.setAttribute('aria-label',(i+1)+'번째 글자 쓰기 칸');
 const ctx=canvas.getContext('2d');
 const ink=document.createElement('canvas');ink.width=ink.height=size;
 const brush=ink.getContext('2d');
 const pad={canvas,ink,char,paint(){
  ctx.clearRect(0,0,size,size);
  ctx.setLineDash([4,5]);ctx.strokeStyle='#dce7df';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(64,0);ctx.lineTo(64,128);ctx.moveTo(0,64);ctx.lineTo(128,64);ctx.stroke();ctx.setLineDash([]);
  if(level===1&&!done)glyph(ctx,char,'#bdc8c1');
  ctx.drawImage(ink,0,0);
 }};
 let pointer=null,last;
 function point(e){
  const r=canvas.getBoundingClientRect();
  return [(e.clientX-r.left)*size/r.width,(e.clientY-r.top)*size/r.height];
 }
 function draw(a,b){
  brush.lineWidth=6;brush.lineCap='round';brush.strokeStyle='#16392f';
  brush.beginPath();brush.moveTo(...a);brush.lineTo(b[0]+.01,b[1]);brush.stroke();pad.paint();
 }
 canvas.onpointerdown=e=>{
  if(done||pointer!==null||e.button!==0)return;
  pointer=e.pointerId;canvas.setPointerCapture(pointer);last=point(e);draw(last,last);
 };
 canvas.onpointermove=e=>{if(e.pointerId!==pointer)return;for(const p of (e.getCoalescedEvents?.()||[]).concat(e)){const end=point(p);draw(last,end);last=end}};
 canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>{if(e.pointerId===pointer)pointer=null};
 $('cells').append(canvas);pad.paint();return pad;
}
function points(canvas){
 const rgba=canvas.getContext('2d').getImageData(0,0,size,size).data;
 const all=[];let x0=size,y0=size,x1=0,y1=0;
 for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(rgba[4*(y*size+x)+3]>95){
  all.push([x,y]);x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);
 }
 const w=x1-x0,h=y1-y0;
 if(all.length<70||w<17||h<17)return [];
 const scale=25/Math.max(w,h);
 const unique=new Set(all.map(([x,y])=>32*Math.round(15.5+(y-(y0+y1)/2)*scale)+Math.round(15.5+(x-(x0+x1)/2)*scale)));
 return [...unique].map(v=>[v%32,v>>5]);
}
function closeFraction(a,b,r){
 return a.filter(([x,y])=>b.some(([u,v])=>(x-u)**2+(y-v)**2<=r*r)).length/a.length;
}
function matches(pad){
 const a=points(pad.ink);if(!a.length)return false;
 const ref=document.createElement('canvas');ref.width=ref.height=size;
 glyph(ref.getContext('2d'),pad.char,'#000');
 const b=points(ref);
 return b.length>0&&closeFraction(a,b,4)>=.83&&closeFraction(b,a,4)>=.81;
}
function render(){

 $('listen').hidden=$('next').hidden=$('cells').hidden=$('check').hidden=$('clear').hidden=true;
 $('check').disabled=$('clear').disabled=false;

 $('choices').replaceChildren();$('choices').hidden=false;
 for(const word of choicesByQuestion[index]){

   $('cells').hidden=$('check').hidden=$('clear').hidden=false;
   pads=[...word].map(makePad);
   $('msg').textContent='한 칸에 한 글자씩 직접 써 보세요.';
  };
  $('choices').append(button);
 }
 [...$('nav').children].forEach((b,i)=>b.setAttribute('aria-current',String(index===i)));
}
$('clear').onclick=()=>pads.forEach(p=>{p.ink.getContext('2d').clearRect(0,0,size,size);p.paint()});
$('check').onclick=()=>{
 if(done||!selected)return;
 if(pads.some(p=>!p.ink.getContext('2d').getImageData(0,0,size,size).data.some((v,i)=>i%4===3&&v>95))){
  $('msg').textContent='모든 칸에 글자를 하나씩 써 보세요.';return;
 }
 if(pads.every(matches)){
  done=true;play(true);
  $('msg').textContent='완성한 문장을 소리 내어 읽어 보세요.';
  $('listen').hidden=!('speechSynthesis' in window);$('next').hidden=false;
  $('next').textContent=index===questions.length-1?'처음으로':'다음 문제';
  $('check').disabled=$('clear').disabled=true;pads.forEach(p=>p.paint());return;
 }
 play(false);level=1;$('clear').click();
 $('msg').textContent='흐린 글씨를 따라 써 보세요.';
};
$('next').onclick=()=>{index=(index+1)%questions.length;render()};
$('listen').onclick=()=>{const q=questions[index];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.before+q.word+q.after);u.lang='ko-KR';u.rate=.8;speechSynthesis.speak(u)};
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'소리 켜짐':'소리 꺼짐';$('sound').setAttribute('aria-pressed',String(sound))};
questions.forEach((q,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'번';b.onclick=()=>{index=i;render()};$('nav').append(b)});
render();
</script></html>
